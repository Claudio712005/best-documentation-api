spring:
  application:
    name: best-documentation-api

  jackson:
    # Absent members are omitted rather than serialized as null. An OpenAPI document declares
    # which members are required; emitting "field": null for every optional one makes payloads
    # noisier without making them more informative.
    default-property-inclusion: non_null
    datatype:
      datetime:
        # ISO-8601 strings, not epoch numbers: the document advertises format: date-time, and the
        # payload has to agree with it. Spring Boot 4 ships Jackson 3, which moved this out of
        # SerializationFeature into DateTimeFeature — the old spring.jackson.serialization key
        # fails the context startup rather than being ignored.
        write-dates-as-timestamps: false
    deserialization:
      # Unknown members are rejected instead of ignored, so a client misspelling a field learns
      # about it at the first call rather than wondering why the value had no effect.
      fail-on-unknown-properties: true

  mvc:
    # Content negotiation stays header-driven. A ".json" suffix or a "?format=" parameter would
    # create representations the OpenAPI document does not describe.
    contentnegotiation:
      favor-parameter: false

# ---------------------------------------------------------------------------------------------
# Contract metadata. Everything here is environment-dependent and therefore kept out of Java
# annotations, which cannot be overridden per profile.
# ---------------------------------------------------------------------------------------------
api:
  title: Best Documentation API
  version: 1.0.0
  problem-base-uri: https://docs.best-documentation-api.dev/problems
  documentation-uri: https://docs.best-documentation-api.dev
  contact:
    name: API Platform Team
    email: api-platform@best-documentation-api.dev
    url: https://docs.best-documentation-api.dev/support
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  servers:
    - url: http://localhost:8080
      description: Local development
    - url: https://sandbox.best-documentation-api.dev
      description: Sandbox — accepts test data, resets nightly
    - url: https://api.best-documentation-api.dev
      description: Production

# ---------------------------------------------------------------------------------------------
# springdoc-openapi
# ---------------------------------------------------------------------------------------------
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
    # OpenAPI 3.1 is already the default in springdoc 3.x. Pinned explicitly so an upgrade can
    # never silently change the dialect of the published document.
    version: openapi-3-1
    # Deliberately OFF. springdoc's built-in schema resolver (SpringDocConfiguration
    # #propertiesResolverForSchema) calls resolveProperties(schema, Locale.getDefault()) — the JVM
    # default locale, not the request locale — so with it enabled every schema description would be
    # frozen in whatever language the server booted with. SchemaLocalizationCustomizer does the
    # same job against the negotiated locale instead.
    #
    # Operations, tags, parameters and responses are unaffected: those paths already receive the
    # request locale, so their message keys resolve natively.
    resolve-schema-properties: false
    resolve-extensions-properties: true

  # Languages the document itself is served in, negotiated by Accept-Language on /v3/api-docs.
  allowed-locales:
    - en-US
    - pt-BR
    - es-ES

  # Builds and caches one document per language at startup, so the first request in each
  # language does not pay the reflection cost.
  pre-loading-enabled: true
  pre-loading-locales:
    - en-US
    - pt-BR
    - es-ES

  # Operation ids and tags come from explicit annotations only. Class-name-derived tags such as
  # "order-controller" leak internal structure into the public contract.
  auto-tag-classes: false
  default-produces-media-type: application/json

  # Annotation values are looked up as MessageSource keys before anything else, so i18n of the
  # document is on. Left explicit because switching it off silently changes every summary into a
  # literal key.
  disable-i18n: false

  model-converters:
    polymorphic-converter:
      # Both flags are stated explicitly on purpose: the configuration metadata reports a default
      # of false, but SpringDocConfiguration#polymorphicModelConverter is registered with
      # @ConditionalOnProperty(matchIfMissing = true), so omitting the property enables it. Never
      # rely on the documented default here.
      #
      # What it actually produces is a <Parent>Variant component holding oneOf of the subtypes
      # while leaving the parent registered and referenced by each child's allOf. Collapsing that
      # into children-only schemas is the job of PolymorphicSchemaCustomizer.
      enabled: true
      one-of-as-ref: true
      one-of-ref-suffix: Variant
    java-nullable-property-customizer:
      # Honours JSpecify @Nullable (shipped with Spring Boot 4) on fields, getters and constructor
      # parameters, emitting the 3.1 type union instead of the removed 3.0 "nullable" keyword.
      enabled: true

  swagger-ui:
    enabled: true
    path: /docs
    disable-swagger-default-url: true
    display-request-duration: true
    doc-expansion: none
    operations-sorter: alpha
    tags-sorter: alpha
    try-it-out-enabled: true
    persist-authorization: true
    show-extensions: true
    show-common-extensions: true

logging:
  level:
    com.clau.best.documentation.api: DEBUG
