spring:
  application:
    name: best-documentation-api

  jackson:
    # Absent members are omitted rather than serialized as null. An OpenAPI document declares
    # which members are required; emitting "field": null for every optional one makes payloads
    # noisier without making them more informative.
    default-property-inclusion: non_null
    serialization:
      # ISO-8601 strings, not epoch numbers: the document advertises format: date-time, and the
      # payload has to agree with it.
      write-dates-as-timestamps: false
    deserialization:
      # Unknown members are rejected instead of ignored, so a client misspelling a field learns
      # about it at the first call rather than wondering why the value had no effect.
      fail-on-unknown-properties: true

  mvc:
    # Content negotiation stays header-driven. A ".json" suffix or a "?format=" parameter would
    # create representations the OpenAPI document does not describe.
    contentnegotiation:
      favor-parameter: false

# ---------------------------------------------------------------------------------------------
# Contract metadata. Everything here is environment-dependent and therefore kept out of Java
# annotations, which cannot be overridden per profile.
# ---------------------------------------------------------------------------------------------
api:
  title: Best Documentation API
  version: 1.0.0
  problem-base-uri: https://docs.best-documentation-api.dev/problems
  documentation-uri: https://docs.best-documentation-api.dev
  contact:
    name: API Platform Team
    email: api-platform@best-documentation-api.dev
    url: https://docs.best-documentation-api.dev/support
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  servers:
    - url: http://localhost:8080
      description: Local development
    - url: https://sandbox.best-documentation-api.dev
      description: Sandbox — accepts test data, resets nightly
    - url: https://api.best-documentation-api.dev
      description: Production

# ---------------------------------------------------------------------------------------------
# springdoc-openapi
# ---------------------------------------------------------------------------------------------
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
    # OpenAPI 3.1 is already the default in springdoc 3.x. Pinned explicitly so an upgrade can
    # never silently change the dialect of the published document.
    version: openapi-3-1
    # Allows ${key} placeholders inside @Schema and @Operation attributes to be resolved, which
    # is what makes a translated document possible without duplicating annotations per language.
    resolve-schema-properties: true
    resolve-extensions-properties: true

  # Languages the document itself is served in, negotiated by Accept-Language on /v3/api-docs.
  allowed-locales:
    - en-US
    - pt-BR
    - es-ES

  # Builds and caches one document per language at startup, so the first request in each
  # language does not pay the reflection cost.
  pre-loading-enabled: true
  pre-loading-locales:
    - en-US
    - pt-BR
    - es-ES

  # Operation ids and tags come from explicit annotations only. Class-name-derived tags such as
  # "order-controller" leak internal structure into the public contract.
  auto-tag-classes: false
  default-produces-media-type: application/json

  swagger-ui:
    enabled: true
    path: /docs
    disable-swagger-default-url: true
    display-request-duration: true
    doc-expansion: none
    operations-sorter: alpha
    tags-sorter: alpha
    try-it-out-enabled: true
    persist-authorization: true
    show-extensions: true
    show-common-extensions: true

logging:
  level:
    com.clau.best.documentation.api: DEBUG
