doc.info.summary=Implementación de referencia de una API REST internacionalizada y exhaustivamente documentada.
doc.info.description=Un catálogo funcional de técnicas de OpenAPI 3.1, concebido tanto para leerse \
  como para invocarse. Cada endpoint existe para demostrar un problema de documentación y su \
  solución: cuerpos de solicitud de dos campos hasta grafos profundamente anidados, contratos \
  construidos por composición en lugar de copia, cargas polimórficas en las que solo las variantes \
  concretas aparecen en la lista de esquemas, y respuestas que el cliente puede acotar.\n\n\
  Toda la superficie se negocia mediante `Accept-Language` — no solo los mensajes de error y el \
  contenido, sino este propio documento. Solicítelo con `Accept-Language: es-ES` y cada resumen, \
  descripción y anotación de esquema se devuelve traducido.

doc.tag.system.description=Comprobación de disponibilidad y metadatos del contrato. Aquí viven los \
  cuerpos de solicitud más pequeños posibles, como referencia para comparar con el resto.
doc.tag.catalog.description=Productos y su contenido localizado. Demuestra cómo los datos \
  traducidos — a diferencia del texto de interfaz traducido — pertenecen a la carga útil.
doc.tag.carts.description=Composición del carrito mediante solicitudes mínimas y de propósito \
  único. Cada operación recibe dos o tres campos como máximo.
doc.tag.payment-instruments.description=Medios de pago polimórficos. Demuestra una unión \
  discriminada en la que solo las variantes concretas se publican como esquemas.
doc.tag.orders.description=Creación y consulta de pedidos. La solicitud y la respuesta más grandes \
  de esta API, y donde la composición se amortiza.

doc.header.accept-language.description=Idiomas preferidos para esta respuesta, como lista ponderada \
  por calidad según la RFC 9110. Se aplica a mensajes de error, violaciones de validación y \
  contenido localizado. Los idiomas no admitidos recurren a `en-US` en lugar de fallar.
doc.header.content-language.description=Idioma realmente utilizado en esta respuesta. Puede diferir \
  del solicitado cuando no se pudo servir ningún idioma preferido.
doc.header.request-id.description=Identificador de correlación proporcionado por el cliente, \
  devuelto en la respuesta y presente en toda carga de error. Se genera cuando falta.
doc.header.idempotency-key.description=Hace que esta operación no idempotente sea segura ante \
  reintentos. Repetir la solicitud con la misma clave devuelve el resultado original; reutilizar la \
  clave con un cuerpo distinto se rechaza con `IDEMPOTENCY_CONFLICT`.

doc.response.400.description=No se pudo interpretar la solicitud — cuerpo ilegible, o un parámetro \
  con el tipo incorrecto.
doc.response.404.description=No existe ningún recurso en esta dirección, o no es visible para el cliente.
doc.response.406.description=Esta API no puede servir ninguno de los idiomas de `Accept-Language`.
doc.response.409.description=La solicitud entra en conflicto con el estado actual del recurso.
doc.response.422.description=La solicitud se entendió pero incumplió una restricción declarada. La \
  carga enumera todas las violaciones, cada una localizada por JSON Pointer.
doc.response.500.description=Fallo inesperado del servidor. Solo incluye un identificador de \
  traza, nunca detalle interno.

doc.operation.system.health.summary=Comprobar la disponibilidad del servicio
doc.operation.system.health.description=Responde de inmediato y no consulta ninguna dependencia. \
  Está pensado para sondas de balanceador, por lo que solo indica si esta instancia puede atender \
  tráfico y nunca agrega el estado de nada aguas abajo.
doc.response.system.health.200=La instancia está atendiendo tráfico.

doc.operation.system.languages.summary=Listar los idiomas admitidos
doc.operation.system.languages.description=Enumera los idiomas aceptados en `Accept-Language`, \
  señalando cuál está atendiendo esta misma respuesta y cuál es el de reserva. Consultable en \
  tiempo de ejecución para que los clientes no incrusten una copia de la lista.
doc.response.system.languages.200=Los idiomas admitidos, con los nombres presentados en el idioma \
  negociado para esta solicitud.

doc.schema.Health.description=Disponibilidad de una sola instancia.
doc.schema.Health.status=Si esta instancia puede atender tráfico.
doc.schema.Health.version=Versión del contrato publicado que implementa esta instancia.
doc.schema.Health.checkedAt=Hora del servidor en la que se evaluó la disponibilidad.
doc.schema.HealthStatus.description=`UP` cuando la instancia atiende tráfico con normalidad, \
  `DEGRADED` cuando sigue respondiendo pero con garantías reducidas.

doc.schema.LanguageDescriptor.description=Un idioma que esta API puede servir.
doc.schema.LanguageDescriptor.tag=Etiqueta de idioma BCP 47, utilizable literalmente en `Accept-Language`.
doc.schema.LanguageDescriptor.displayName=Nombre del idioma, presentado en el idioma negociado para \
  esta solicitud y no en el idioma descrito.
doc.schema.LanguageDescriptor.negotiated=Verdadero para el idioma que atiende esta respuesta.
doc.schema.LanguageDescriptor.fallback=Verdadero para el idioma empleado cuando no se puede servir \
  ninguno de los solicitados.

doc.schema.Problem.description=Carga de error conforme a la RFC 9457 (Problem Details for HTTP \
  APIs). Se sirve con el media type `application/problem+json` en toda operación que falla.
doc.schema.Problem.type=URI que identifica el tipo de problema. Resuelve a la documentación que \
  describe el fallo y cómo recuperarse de él.
doc.schema.Problem.title=Resumen breve y legible del tipo de problema. Estable para un `type` dado \
  y nunca interpolado con datos de la solicitud, por lo que es seguro como clave de registro.
doc.schema.Problem.status=Código de estado HTTP, repetido aquí para que la carga sea autocontenida.
doc.schema.Problem.detail=Explicación específica de esta ocurrencia. Puede interpolar datos de la \
  solicitud, así que los clientes no deben analizarla.
doc.schema.Problem.instance=Referencia URI que identifica esta ocurrencia concreta — la ruta de la solicitud.
doc.schema.Problem.code=Extensión de la RFC 9457. Código de error legible por máquina; el valor \
  sobre el que deben ramificar los clientes.
doc.schema.Problem.traceId=Extensión de la RFC 9457. Identificador de correlación, reflejado del \
  `X-Request-Id` de la solicitud o generado. Indíquelo en los tickets de soporte.
doc.schema.Problem.timestamp=Extensión de la RFC 9457. Hora del servidor en la que se observó el fallo.
doc.schema.Problem.violations=Extensión de la RFC 9457. Presente solo en `VALIDATION_FAILED`, \
  enumerando todas las restricciones incumplidas y no solo la primera.

doc.schema.FieldViolation.description=Una sola violación de restricción, localizada mediante JSON \
  Pointer dentro de la solicitud.
doc.schema.FieldViolation.pointer=JSON Pointer (RFC 6901) al nodo infractor del cuerpo de la \
  solicitud, incluidos los índices de array.
doc.schema.FieldViolation.constraint=Identificador de la restricción incumplida, estable entre idiomas.
doc.schema.FieldViolation.message=Explicación localizada, respetando el `Accept-Language` de la solicitud.
doc.schema.FieldViolation.rejectedValue=El valor rechazado, devuelto para depuración. Se omite \
  cuando falta o cuando contiene datos sensibles.

doc.schema.ApiErrorCode.description=Identificador estable y legible por máquina del fallo. Ramifique \
  sobre este valor en lugar del estado HTTP, que es deliberadamente grueso — varios fallos sin \
  relación comparten un mismo estado.
doc.schema.SupportedLanguage.description=Etiqueta de idioma aceptada por la cabecera \
  `Accept-Language`, en formato BCP 47.

doc.operation.payment.register.summary=Registrar un medio de pago
doc.operation.payment.register.description=Acepta cualquiera de las cuatro variantes. El miembro \
  `type` selecciona la variante y determina qué otros miembros son obligatorios — consulte los \
  ejemplos con nombre, cada uno una carga que puede enviarse sin modificar.\n\n\
  Los secretos como el número de tarjeta y el código de seguridad son de solo escritura: \
  obligatorios aquí y ausentes de toda respuesta.
doc.request.payment.register=El medio de pago a registrar. Una de las cuatro variantes, seleccionada por `type`.
doc.response.payment.register.201=Registrado. La cabecera `Location` contiene la URL del nuevo recurso.

doc.operation.payment.get.summary=Consultar un medio de pago
doc.operation.payment.get.description=Devuelve un medio de pago registrado. El objeto anidado es la \
  misma unión discriminada usada en el registro, menos los miembros de solo escritura.
doc.response.payment.get.200=El medio de pago solicitado.
doc.parameter.payment.instrumentId=Identificador asignado por el servidor al medio de pago.

doc.operation.payment.list.summary=Listar medios de pago
doc.operation.payment.list.description=Devuelve todos los medios de pago registrados, en orden de registro.
doc.response.payment.list.200=Los medios de pago registrados, del más antiguo al más reciente.

doc.example.payment.card=Tarjeta, la variante más amplia
doc.example.payment.pix=Clave Pix, la variante más reducida
doc.example.payment.boleto=Pagador de boleto
doc.example.payment.wallet=Cuenta de cartera digital

doc.schema.PaymentInstrumentType.description=Selecciona la variante del medio de pago. Este es el \
  discriminador: decide qué otros miembros debe contener la carga.
doc.schema.PaymentInstrument.description=Base de la jerarquía de medios de pago. Nunca se publica \
  como esquema — sus miembros se incorporan a cada variante, por lo que ningún endpoint la referencia.
doc.schema.PaymentInstrument.type=Variante de este medio de pago, y el miembro que lee el \
  discriminador. Se devuelve en las respuestas además de aceptarse en las solicitudes, para que el \
  cliente pueda completar el ciclo.
doc.schema.PaymentInstrument.label=Nombre que el titular da a este medio de pago, mostrado al \
  elegir entre varios.
doc.schema.PaymentInstrument.holderName=Nombre del titular tal como figura en el medio de pago.
doc.schema.PaymentInstrument.preferred=Si este medio debe ofrecerse primero. Nulo significa que el \
  titular no ha expresado preferencia, lo que difiere de haberlo rechazado.

doc.schema.CardInstrument.description=Una tarjeta de pago. La variante más amplia de la unión.
doc.schema.CardInstrument.number=Número de tarjeta, de 13 a 19 dígitos sin separadores. De solo \
  escritura: obligatorio al registrar y ausente de toda respuesta.
doc.schema.CardInstrument.expiryMonth=Mes de caducidad, 1 para enero hasta 12 para diciembre.
doc.schema.CardInstrument.expiryYear=Año de caducidad, cuatro dígitos.
doc.schema.CardInstrument.securityCode=Código de verificación de la tarjeta, 3 o 4 dígitos. De solo \
  escritura, y nunca almacenado.

doc.schema.PixInstrument.description=Una clave Pix. La variante más reducida de la unión — dos \
  miembros frente a los seis de la tarjeta.
doc.schema.PixInstrument.keyType=Tipo de clave Pix, que determina el formato que debe tener `key`.
doc.schema.PixInstrument.key=La clave en sí. Su formato depende de `keyType`: 11 dígitos para \
  `CPF`, 14 para `CNPJ`, una dirección de correo para `EMAIL`, un número E.164 para `PHONE`, un \
  UUID para `RANDOM`. Es una restricción dependiente que JSON Schema no puede expresar, por lo que \
  se valida en el servicio y se declara aquí en lugar de insinuarse con una palabra clave.
doc.schema.PixKeyType.description=Tipo de clave Pix, que determina el formato esperado de `key`.

doc.schema.BoletoInstrument.description=Registro de pagador de boleto.
doc.schema.BoletoInstrument.taxId=Identificador fiscal del pagador: 11 dígitos para una persona \
  física, 14 para una empresa, sin separadores.
doc.schema.BoletoInstrument.postalCode=Código postal del pagador, con o sin separador.

doc.schema.WalletInstrument.description=Cuenta de cartera digital. Contiene un token emitido por el \
  proveedor en lugar de cualquier detalle del medio de pago subyacente.
doc.schema.WalletInstrument.provider=Proveedor de cartera que mantiene la cuenta.
doc.schema.WalletInstrument.accountReference=Identificador de la cuenta ante el proveedor. Seguro \
  de devolver, a diferencia del token de dispositivo.
doc.schema.WalletInstrument.deviceToken=Token de dispositivo emitido por el proveedor. De solo \
  escritura: obligatorio al registrar y ausente de toda respuesta.
doc.schema.WalletProvider.description=Proveedor de cartera que mantiene la cuenta.

doc.schema.PaymentInstrumentResource.description=Un medio de pago registrado: los miembros \
  asignados por el servidor, más la variante enviada por el cliente anidada en su interior.
doc.schema.PaymentInstrumentResource.id=Identificador asignado por el servidor. Solo lectura.
doc.schema.PaymentInstrumentResource.registeredAt=Cuándo se registró el medio de pago. Solo lectura.
doc.schema.PaymentInstrumentResource.instrument=El medio de pago en sí, como la misma unión \
  discriminada aceptada al registrar.

doc.tag.boletos.description=Emisión de recibos bancarios mediante un único endpoint que acepta tres \
  categorías. Un indicador en el cuerpo selecciona la categoría, y tanto el cuerpo aceptado como el \
  objeto devuelto crecen o se reducen con ella.

doc.operation.boleto.issue.summary=Emitir un recibo bancario
doc.operation.boleto.issue.description=Un endpoint, tres categorías. El miembro `category` del cuerpo \
  selecciona qué variante se envía, y la respuesta es la variante correspondiente — es decir, la \
  forma de lo que recibe la decide la forma de lo que envió.\n\n\
  `SIMPLE` es la carga más pequeña de esta API: pagador, importe, vencimiento. `HYBRID` añade una \
  clave Pix y devuelve un objeto de código QR para el que la variante simple no tiene miembro. \
  `SPLIT` añade una lista de beneficiarios y devuelve un reparto calculado por beneficiario.\n\n\
  Use el selector de ejemplos en la solicitud y en la respuesta para comparar las tres en paralelo.
doc.request.boleto.issue=El recibo a emitir. Una de las tres categorías, seleccionada por `category`.
doc.response.boleto.issue.201=Emitido. La variante corresponde a la categoría solicitada, y la \
  cabecera `Location` contiene la URL del nuevo recibo.

doc.operation.boleto.get.summary=Consultar un recibo bancario
doc.operation.boleto.get.description=Devuelve un recibo emitido como la variante con la que se \
  emitió, por lo que el cliente debe ramificar en `category` igual que en la emisión.
doc.response.boleto.get.200=El recibo solicitado.
doc.parameter.boleto.boletoId=Identificador asignado por el servidor al recibo.

doc.operation.boleto.list.summary=Listar los recibos emitidos
doc.operation.boleto.list.description=Devuelve todos los recibos emitidos en orden de emisión. El \
  array mezcla categorías, que es precisamente el caso que más se equivoca.
doc.response.boleto.list.200=Los recibos emitidos, del más antiguo al más reciente.

doc.example.boleto.request.simple=SIMPLE — el cuerpo más pequeño
doc.example.boleto.request.simple.description=Cuatro miembros, ningún dato opcional. Es el mínimo que \
  acepta el endpoint.
doc.example.boleto.request.hybrid=HYBRID — añade pago instantáneo
doc.example.boleto.request.hybrid.description=Todo lo que recibe SIMPLE, más la clave Pix y la \
  validez del código QR que hacen el recibo pagadero al instante.
doc.example.boleto.request.split=SPLIT — el cuerpo más grande
doc.example.boleto.request.split.description=Añade una lista anidada de beneficiarios cuyos \
  porcentajes el servicio convierte en importes monetarios.

doc.example.boleto.response.simple=SIMPLE — los menos miembros
doc.example.boleto.response.simple.description=Código de barras, línea legible, importe y fechas. \
  Nada que un recibo simple no tenga.
doc.example.boleto.response.hybrid=HYBRID — añade el objeto de código QR
doc.example.boleto.response.hybrid.description=Observe `qrCode`: un objeto anidado sin equivalente en \
  la respuesta SIMPLE, y por eso ramificar en `category` resulta inevitable.
doc.example.boleto.response.split=SPLIT — añade el reparto calculado
doc.example.boleto.response.split.description=Un reparto por beneficiario, cada uno con el importe \
  monetario que el servicio derivó del porcentaje solicitado.

doc.schema.Money.description=Un importe monetario con su moneda. Nunca un número suelto: un importe \
  sin moneda es la ambigüedad más costosa que puede contener un contrato de pagos.
doc.schema.Money.amount=Importe decimal, como máximo dos decimales. Se envía como número JSON, sin \
  separador de miles.
doc.schema.Money.currency=Código alfabético de moneda ISO 4217.

doc.schema.TaxIdentifier.description=Un identificador fiscal brasileño, cuyo tipo se deriva de su longitud.
doc.schema.TaxIdentifier.value=11 dígitos para una persona física, 14 para una empresa, sin separadores.
doc.schema.TaxIdentifier.kind=Si el identificador pertenece a una persona física o a una empresa. Lo \
  deriva el servicio, por lo que es de solo lectura y no debe enviarse.
doc.schema.TaxIdentifierKind.description=Si un identificador fiscal pertenece a una persona física o a una empresa.

doc.schema.Payer.description=Quién debe el recibo. Compartido por las tres categorías.
doc.schema.Payer.name=Nombre completo o razón social del pagador.
doc.schema.Payer.taxId=Identificador fiscal del pagador.
doc.schema.Payer.postalCode=Código postal del domicilio del pagador, con o sin separador.

doc.schema.BoletoCategory.description=Selecciona la variante del recibo. Es el discriminador de la \
  solicitud y de la respuesta: decide qué miembros lleva cada una.
doc.schema.BoletoRequest.description=Base de la solicitud de emisión. Nunca se publica como esquema — \
  sus miembros se incorporan a cada categoría, por lo que ningún endpoint la referencia.
doc.schema.BoletoRequest.category=Categoría que se emite, y el miembro que lee el discriminador.
doc.schema.BoletoRequest.payer=Quién debe el recibo.
doc.schema.BoletoRequest.amount=Valor nominal del recibo.
doc.schema.BoletoRequest.dueDate=Fecha de vencimiento. Debe estar en el futuro.
doc.schema.BoletoRequest.reference=Su propio identificador para este recibo, devuelto en la \
  conciliación. Nulo cuando no tiene ninguno que indicar.

doc.schema.SimpleBoletoRequest.description=Un recibo corriente, pagadero solo por código de barras o \
  línea legible. El cuerpo de solicitud más pequeño de esta API.
doc.schema.HybridBoletoRequest.description=Un recibo que además es pagadero al instante mediante Pix.
doc.schema.HybridBoletoRequest.pixKey=Clave Pix que recibe el pago instantáneo de este recibo.
doc.schema.HybridBoletoRequest.qrCodeValidityMinutes=Cuántos minutos sigue siendo válido el código QR \
  generado. El recibo continúa pagadero por código de barras tras su caducidad.
doc.schema.HybridBoletoRequest.allowPartialPayment=Si un pago inferior al valor nominal liquida el \
  recibo parcialmente. Nulo se trata como no permitido.

doc.schema.SplitBoletoRequest.description=Un recibo cuyo producto se divide entre varios \
  beneficiarios. El cuerpo de solicitud más grande de esta API.
doc.schema.SplitBoletoRequest.recipients=Quién recibe el producto, y en qué proporción. Los \
  porcentajes deben sumar 100.
doc.schema.SplitBoletoRequest.settlementMode=Cuándo se liquida la parte de cada beneficiario.
doc.schema.SplitBoletoRequest.statementDescriptor=Texto mostrado en el extracto de los beneficiarios.
doc.schema.SettlementMode.description=`ON_PAYMENT` liquida cada parte en cuanto se paga el recibo, \
  `ON_SCHEDULE` liquida según el calendario de abono del propio beneficiario.
doc.schema.SplitRecipient.description=Un beneficiario del reparto, y la parte reclamada para él.
doc.schema.SplitRecipient.name=Razón social del beneficiario.
doc.schema.SplitRecipient.taxId=Identificador fiscal del beneficiario.
doc.schema.SplitRecipient.percentage=Parte del valor nominal reclamada para este beneficiario, en \
  porcentaje. Todos los beneficiarios deben sumar 100.

doc.schema.BoletoResponse.description=Base del recibo emitido. Nunca se publica como esquema — sus \
  miembros se incorporan a cada categoría.
doc.schema.BoletoResponse.category=Categoría de este recibo. Ramifique en ella para saber qué otros \
  miembros están presentes.
doc.schema.BoletoResponse.status=Estado del ciclo de vida del recibo.
doc.schema.BoletoStatus.description=Estado del ciclo de vida: emitido a la espera de pago, liquidado, \
  cancelado antes del pago, o caducado sin pagar.
doc.schema.BoletoResponse.id=Identificador asignado por el servidor al recibo.
doc.schema.BoletoResponse.barcode=Dígitos del código de barras, legibles por máquina, sin separadores.
doc.schema.BoletoResponse.digitableLine=Los mismos dígitos agrupados para teclear, con los \
  separadores que el pagador ve impresos en el recibo.
doc.schema.BoletoResponse.amount=Valor nominal del recibo, tal como se emitió.
doc.schema.BoletoResponse.dueDate=Fecha de vencimiento del recibo.
doc.schema.BoletoResponse.issuedAt=Cuándo se emitió el recibo.

doc.schema.SimpleBoletoResponse.description=Un recibo corriente emitido. No lleva nada más allá de \
  los miembros que tiene toda categoría, y es la referencia contra la que deben leerse las otras dos.
doc.schema.HybridBoletoResponse.description=Un recibo emitido que además es pagadero mediante Pix.
doc.schema.HybridBoletoResponse.qrCode=El código QR generado. Ausente de todas las demás categorías, \
  y la razón por la que el cliente no puede tratar las tres respuestas como un único tipo.
doc.schema.HybridBoletoResponse.partialPaymentAllowed=Si un pago inferior al valor nominal liquida el \
  recibo parcialmente, según se resolvió en la emisión.
doc.schema.QrCode.description=Un código QR de Pix: la carga a codificar, una imagen renderizada, y \
  cuándo deja de ser válido.
doc.schema.QrCode.payload=Carga EMV QR Code. Codifíquela tal cual; no la reformatee.
doc.schema.QrCode.imageUri=URL del código renderizado, para clientes que no pueden codificar la carga \
  por sí mismos.
doc.schema.QrCode.expiresAt=Cuándo deja de aceptarse el código. El recibo sigue pagadero por código \
  de barras.

doc.schema.SplitBoletoResponse.description=Un recibo emitido con su producto dividido entre beneficiarios.
doc.schema.SplitBoletoResponse.splits=Un reparto por beneficiario solicitado, con el importe \
  monetario que el servicio calculó a partir del porcentaje.
doc.schema.SplitBoletoResponse.settlementMode=Cuándo se liquida cada parte, según se resolvió en la emisión.
doc.schema.SplitAllocation.description=Lo que recibe un beneficiario del reparto, con el importe \
  calculado junto al porcentaje solicitado.
doc.schema.SplitAllocation.name=Razón social del beneficiario.
doc.schema.SplitAllocation.taxId=Identificador fiscal del beneficiario.
doc.schema.SplitAllocation.percentage=Porcentaje solicitado para este beneficiario.
doc.schema.SplitAllocation.amount=Parte monetaria derivada del porcentaje, redondeada half-even a la \
  unidad menor de la moneda.
