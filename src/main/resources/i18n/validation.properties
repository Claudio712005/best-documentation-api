# Constraint violation copy — English (United States). Base bundle.
#
# The jakarta.validation.* keys override Hibernate Validator's own bundle, which only ships a
# handful of languages and would otherwise answer in English regardless of Accept-Language.

jakarta.validation.constraints.NotNull.message=must be present
jakarta.validation.constraints.NotBlank.message=must not be blank
jakarta.validation.constraints.NotEmpty.message=must not be empty
jakarta.validation.constraints.Size.message=size must be between {min} and {max}
jakarta.validation.constraints.Min.message=must be greater than or equal to {value}
jakarta.validation.constraints.Max.message=must be less than or equal to {value}
jakarta.validation.constraints.DecimalMin.message=must be greater than or equal to {value}
jakarta.validation.constraints.DecimalMax.message=must be less than or equal to {value}
jakarta.validation.constraints.Positive.message=must be greater than zero
jakarta.validation.constraints.PositiveOrZero.message=must be zero or greater
jakarta.validation.constraints.Digits.message=must have at most {integer} integer digits and {fraction} decimal digits
jakarta.validation.constraints.Pattern.message=must match the expected format
jakarta.validation.constraints.Email.message=must be a well-formed email address
jakarta.validation.constraints.Past.message=must be a past date
jakarta.validation.constraints.PastOrPresent.message=must be a past or present date
jakarta.validation.constraints.Future.message=must be a future date
jakarta.validation.constraints.FutureOrPresent.message=must be a present or future date
jakarta.validation.constraints.AssertTrue.message=must be true

# Domain-specific constraints, keyed by the contract element they guard.
validation.money.currency=must be an ISO 4217 alphabetic currency code
validation.money.amount=must be a monetary amount with at most 2 decimal places
validation.product.sku=must be a SKU of 8 to 16 uppercase letters, digits or hyphens
validation.quantity=must be between 1 and 999 units
validation.language.tag=must be a BCP 47 language tag served by this API
validation.localized.content=must provide content for at least the default language
validation.boleto.taxId=must be 11 digits for an individual or 14 for a company, with no separators
