# Runtime response copy — English (United States). Base bundle: the fallback for any
# language the client asks for that this API does not serve.
#
# Titles are stable per error code and must stay free of interpolated request data.
# Details describe the single occurrence and may interpolate.

problem.VALIDATION_FAILED.title=Validation failed
problem.VALIDATION_FAILED.detail=The request body failed {0} constraint(s). See "violations" for the exact locations.

problem.MALFORMED_REQUEST.title=Malformed request
problem.MALFORMED_REQUEST.detail=The request body could not be parsed as valid JSON matching the expected schema.

problem.INVALID_PARAMETER.title=Invalid parameter
problem.INVALID_PARAMETER.detail=Parameter "{0}" is missing or carries an unusable value.

problem.RESOURCE_NOT_FOUND.title=Resource not found
problem.RESOURCE_NOT_FOUND.detail=No {0} exists with identifier "{1}".

problem.RESOURCE_CONFLICT.title=Resource conflict
problem.RESOURCE_CONFLICT.detail=The request conflicts with the current state of this {0}.

problem.UNSUPPORTED_LANGUAGE.title=Unsupported language
problem.UNSUPPORTED_LANGUAGE.detail=None of the languages in "Accept-Language" is served by this API. Supported: {0}.

problem.CURRENCY_MISMATCH.title=Currency mismatch
problem.CURRENCY_MISMATCH.detail=Monetary values in a single request must share one currency, but found {0} and {1}.

problem.PAYMENT_INSTRUMENT_REJECTED.title=Payment instrument rejected
problem.PAYMENT_INSTRUMENT_REJECTED.detail=Payment instrument "{0}" cannot be used for this operation.

problem.IDEMPOTENCY_CONFLICT.title=Idempotency conflict
problem.IDEMPOTENCY_CONFLICT.detail=Idempotency key "{0}" was already used with a different request body.

problem.INTERNAL_ERROR.title=Internal server error
problem.INTERNAL_ERROR.detail=The request could not be completed. Quote trace identifier "{0}" when reporting this.
