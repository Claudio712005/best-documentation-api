# Copy for the OpenAPI document itself — Brazilian Portuguese.

doc.info.summary=Implementação de referência de uma API REST internacionalizada e exaustivamente documentada.
doc.info.description=Um catálogo funcional de técnicas de OpenAPI 3.1, feito tanto para ser lido \
  quanto chamado. Cada endpoint existe para demonstrar um problema de documentação e sua solução: \
  corpos de requisição de dois campos até grafos profundamente aninhados, contratos montados por \
  composição em vez de cópia, payloads polimórficos em que apenas as variantes concretas aparecem \
  na lista de schemas, e respostas que o cliente pode estreitar.\n\n\
  Toda a superfície é negociada por `Accept-Language` — não só mensagens de erro e conteúdo, mas \
  este próprio documento. Requisite com `Accept-Language: pt-BR` e cada resumo, descrição e \
  anotação de schema volta traduzido.

doc.tag.system.description=Liveness e metadados do contrato. Os menores corpos de requisição \
  possíveis vivem aqui, como linha de base para comparar com o resto.
doc.tag.catalog.description=Produtos e seu conteúdo localizado. Demonstra como dado traduzido — \
  ao contrário de texto de interface traduzido — pertence ao payload.
doc.tag.carts.description=Montagem de carrinho por requisições mínimas e de propósito único. Cada \
  operação recebe no máximo dois ou três campos.
doc.tag.payment-instruments.description=Meios de pagamento polimórficos. Demonstra uma união \
  discriminada em que só as variantes concretas são publicadas como schemas.
doc.tag.orders.description=Criação e consulta de pedidos. A maior requisição e a maior resposta \
  desta API, e onde a composição se paga.

doc.header.accept-language.description=Idiomas preferidos para esta resposta, como lista ponderada \
  por qualidade conforme a RFC 9110. Vale para mensagens de erro, violações de validação e \
  conteúdo localizado. Idiomas não suportados caem para `en-US` em vez de falhar.
doc.header.content-language.description=Idioma efetivamente usado nesta resposta. Pode divergir da \
  requisição quando nenhum idioma preferido pôde ser atendido.
doc.header.request-id.description=Identificador de correlação fornecido pelo cliente, devolvido na \
  resposta e presente em todo payload de erro. Gerado quando ausente.
doc.header.idempotency-key.description=Torna esta operação não-idempotente segura para repetição. \
  Repetir a requisição com a mesma chave devolve o resultado original; reusar a chave com corpo \
  diferente é recusado com `IDEMPOTENCY_CONFLICT`.

doc.response.400.description=A requisição não pôde ser compreendida — corpo ilegível, ou parâmetro \
  com tipo incorreto.
doc.response.404.description=Nenhum recurso existe neste endereço, ou ele não é visível ao cliente.
doc.response.406.description=Nenhum idioma de `Accept-Language` pode ser atendido por esta API.
doc.response.409.description=A requisição conflita com o estado atual do recurso.
doc.response.422.description=A requisição foi compreendida mas violou uma restrição declarada. O \
  payload lista todas as violações, cada uma localizada por JSON Pointer.
doc.response.500.description=Falha inesperada no servidor. Carrega apenas um identificador de \
  rastreio, nunca detalhe interno.

# --- system -----------------------------------------------------------------------------------
doc.operation.system.health.summary=Verificar liveness do serviço
doc.operation.system.health.description=Responde imediatamente e não toca em nenhuma dependência. \
  Destinado a probes de load balancer, e por isso informa apenas se esta instância consegue \
  atender tráfego, nunca agregando a saúde de nada downstream.
doc.response.system.health.200=A instância está atendendo tráfego.

doc.operation.system.languages.summary=Listar idiomas suportados
doc.operation.system.languages.description=Enumera os idiomas aceitos em `Accept-Language`, \
  sinalizando qual está atendendo esta própria resposta e qual é o fallback. Descobrível em tempo \
  de execução para que clientes não precisem embutir uma cópia da lista.
doc.response.system.languages.200=Os idiomas suportados, com nomes de exibição renderizados no \
  idioma negociado para esta requisição.

doc.schema.Health.description=Liveness de uma única instância.
doc.schema.Health.status=Se esta instância consegue atender tráfego.
doc.schema.Health.version=Versão do contrato publicado que esta instância implementa.
doc.schema.Health.checkedAt=Horário do servidor em que o liveness foi avaliado.
doc.schema.HealthStatus.description=`UP` quando a instância atende tráfego normalmente, \
  `DEGRADED` quando ainda responde mas com garantias reduzidas.

doc.schema.LanguageDescriptor.description=Um idioma que esta API consegue atender.
doc.schema.LanguageDescriptor.tag=Tag de idioma BCP 47, usável literalmente em `Accept-Language`.
doc.schema.LanguageDescriptor.displayName=Nome do idioma, renderizado no idioma negociado para esta \
  requisição em vez de no idioma descrito.
doc.schema.LanguageDescriptor.negotiated=Verdadeiro para o idioma que está atendendo esta resposta.
doc.schema.LanguageDescriptor.fallback=Verdadeiro para o idioma usado quando nenhum dos solicitados \
  pode ser atendido.

# --- errors -----------------------------------------------------------------------------------
doc.schema.Problem.description=Payload de erro conforme a RFC 9457 (Problem Details for HTTP APIs). \
  Servido com o media type `application/problem+json` por toda operação que falha nesta API.
doc.schema.Problem.type=URI que identifica o tipo do problema. Resolve para a documentação que \
  descreve a falha e como se recuperar dela.
doc.schema.Problem.title=Resumo curto e legível do tipo do problema. Estável para um dado `type` e \
  nunca interpolado com dados da requisição, portanto seguro como chave de log.
doc.schema.Problem.status=Código de status HTTP, repetido aqui para o payload ser autocontido.
doc.schema.Problem.detail=Explicação específica desta ocorrência. Pode interpolar dados da \
  requisição, então não deve ser parseada por clientes.
doc.schema.Problem.instance=Referência URI que identifica esta ocorrência específica — o caminho da requisição.
doc.schema.Problem.code=Extensão da RFC 9457. Código de erro legível por máquina; o valor sobre o \
  qual clientes devem ramificar.
doc.schema.Problem.traceId=Extensão da RFC 9457. Identificador de correlação, ecoado do \
  `X-Request-Id` da requisição ou gerado. Informe-o em tickets de suporte.
doc.schema.Problem.timestamp=Extensão da RFC 9457. Horário do servidor em que a falha foi observada.
doc.schema.Problem.violations=Extensão da RFC 9457. Presente apenas em `VALIDATION_FAILED`, \
  listando todas as restrições violadas em vez de apenas a primeira.

doc.schema.FieldViolation.description=Uma única violação de restrição, localizada por JSON Pointer \
  dentro da requisição.
doc.schema.FieldViolation.pointer=JSON Pointer (RFC 6901) para o nó infrator no corpo da \
  requisição, incluindo índices de array.
doc.schema.FieldViolation.constraint=Identificador da restrição violada, estável entre idiomas.
doc.schema.FieldViolation.message=Explicação localizada, respeitando o `Accept-Language` da requisição.
doc.schema.FieldViolation.rejectedValue=O valor recusado, devolvido para depuração. Omitido quando \
  ausente ou quando carrega dado sensível.

doc.schema.ApiErrorCode.description=Identificador estável e legível por máquina da falha. Ramifique \
  sobre este valor em vez do status HTTP, que é propositalmente grosseiro — várias falhas sem \
  relação compartilham um mesmo status.
doc.schema.SupportedLanguage.description=Tag de idioma aceita pelo header `Accept-Language`, no \
  formato BCP 47.
