doc.info.summary=Implementação de referência de uma API REST internacionalizada e exaustivamente documentada.
doc.info.description=Um catálogo funcional de técnicas de OpenAPI 3.1, feito tanto para ser lido \
  quanto chamado. Cada endpoint existe para demonstrar um problema de documentação e sua solução: \
  corpos de requisição de dois campos até grafos profundamente aninhados, contratos montados por \
  composição em vez de cópia, payloads polimórficos em que apenas as variantes concretas aparecem \
  na lista de schemas, e respostas que o cliente pode estreitar.\n\n\
  Toda a superfície é negociada por `Accept-Language` — não só mensagens de erro e conteúdo, mas \
  este próprio documento. Requisite com `Accept-Language: pt-BR` e cada resumo, descrição e \
  anotação de schema volta traduzido.

doc.tag.system.description=Liveness e metadados do contrato. Os menores corpos de requisição \
  possíveis vivem aqui, como linha de base para comparar com o resto.
doc.tag.catalog.description=Produtos e seu conteúdo localizado. Demonstra como dado traduzido — \
  ao contrário de texto de interface traduzido — pertence ao payload.
doc.tag.carts.description=Montagem de carrinho por requisições mínimas e de propósito único. Cada \
  operação recebe no máximo dois ou três campos.
doc.tag.payment-instruments.description=Meios de pagamento polimórficos. Demonstra uma união \
  discriminada em que só as variantes concretas são publicadas como schemas.
doc.tag.orders.description=Criação e consulta de pedidos. A maior requisição e a maior resposta \
  desta API, e onde a composição se paga.

doc.header.accept-language.description=Idiomas preferidos para esta resposta, como lista ponderada \
  por qualidade conforme a RFC 9110. Vale para mensagens de erro, violações de validação e \
  conteúdo localizado. Idiomas não suportados caem para `en-US` em vez de falhar.
doc.header.content-language.description=Idioma efetivamente usado nesta resposta. Pode divergir da \
  requisição quando nenhum idioma preferido pôde ser atendido.
doc.header.request-id.description=Identificador de correlação fornecido pelo cliente, devolvido na \
  resposta e presente em todo payload de erro. Gerado quando ausente.
doc.header.idempotency-key.description=Torna esta operação não-idempotente segura para repetição. \
  Repetir a requisição com a mesma chave devolve o resultado original; reusar a chave com corpo \
  diferente é recusado com `IDEMPOTENCY_CONFLICT`.

doc.response.400.description=A requisição não pôde ser compreendida — corpo ilegível, ou parâmetro \
  com tipo incorreto.
doc.response.404.description=Nenhum recurso existe neste endereço, ou ele não é visível ao cliente.
doc.response.406.description=Nenhum idioma de `Accept-Language` pode ser atendido por esta API.
doc.response.409.description=A requisição conflita com o estado atual do recurso.
doc.response.422.description=A requisição foi compreendida mas violou uma restrição declarada. O \
  payload lista todas as violações, cada uma localizada por JSON Pointer.
doc.response.500.description=Falha inesperada no servidor. Carrega apenas um identificador de \
  rastreio, nunca detalhe interno.

doc.operation.system.health.summary=Verificar liveness do serviço
doc.operation.system.health.description=Responde imediatamente e não toca em nenhuma dependência. \
  Destinado a probes de load balancer, e por isso informa apenas se esta instância consegue \
  atender tráfego, nunca agregando a saúde de nada downstream.
doc.response.system.health.200=A instância está atendendo tráfego.

doc.operation.system.languages.summary=Listar idiomas suportados
doc.operation.system.languages.description=Enumera os idiomas aceitos em `Accept-Language`, \
  sinalizando qual está atendendo esta própria resposta e qual é o fallback. Descobrível em tempo \
  de execução para que clientes não precisem embutir uma cópia da lista.
doc.response.system.languages.200=Os idiomas suportados, com nomes de exibição renderizados no \
  idioma negociado para esta requisição.

doc.schema.Health.description=Liveness de uma única instância.
doc.schema.Health.status=Se esta instância consegue atender tráfego.
doc.schema.Health.version=Versão do contrato publicado que esta instância implementa.
doc.schema.Health.checkedAt=Horário do servidor em que o liveness foi avaliado.
doc.schema.HealthStatus.description=`UP` quando a instância atende tráfego normalmente, \
  `DEGRADED` quando ainda responde mas com garantias reduzidas.

doc.schema.LanguageDescriptor.description=Um idioma que esta API consegue atender.
doc.schema.LanguageDescriptor.tag=Tag de idioma BCP 47, usável literalmente em `Accept-Language`.
doc.schema.LanguageDescriptor.displayName=Nome do idioma, renderizado no idioma negociado para esta \
  requisição em vez de no idioma descrito.
doc.schema.LanguageDescriptor.negotiated=Verdadeiro para o idioma que está atendendo esta resposta.
doc.schema.LanguageDescriptor.fallback=Verdadeiro para o idioma usado quando nenhum dos solicitados \
  pode ser atendido.

doc.schema.Problem.description=Payload de erro conforme a RFC 9457 (Problem Details for HTTP APIs). \
  Servido com o media type `application/problem+json` por toda operação que falha nesta API.
doc.schema.Problem.type=URI que identifica o tipo do problema. Resolve para a documentação que \
  descreve a falha e como se recuperar dela.
doc.schema.Problem.title=Resumo curto e legível do tipo do problema. Estável para um dado `type` e \
  nunca interpolado com dados da requisição, portanto seguro como chave de log.
doc.schema.Problem.status=Código de status HTTP, repetido aqui para o payload ser autocontido.
doc.schema.Problem.detail=Explicação específica desta ocorrência. Pode interpolar dados da \
  requisição, então não deve ser parseada por clientes.
doc.schema.Problem.instance=Referência URI que identifica esta ocorrência específica — o caminho da requisição.
doc.schema.Problem.code=Extensão da RFC 9457. Código de erro legível por máquina; o valor sobre o \
  qual clientes devem ramificar.
doc.schema.Problem.traceId=Extensão da RFC 9457. Identificador de correlação, ecoado do \
  `X-Request-Id` da requisição ou gerado. Informe-o em tickets de suporte.
doc.schema.Problem.timestamp=Extensão da RFC 9457. Horário do servidor em que a falha foi observada.
doc.schema.Problem.violations=Extensão da RFC 9457. Presente apenas em `VALIDATION_FAILED`, \
  listando todas as restrições violadas em vez de apenas a primeira.

doc.schema.FieldViolation.description=Uma única violação de restrição, localizada por JSON Pointer \
  dentro da requisição.
doc.schema.FieldViolation.pointer=JSON Pointer (RFC 6901) para o nó infrator no corpo da \
  requisição, incluindo índices de array.
doc.schema.FieldViolation.constraint=Identificador da restrição violada, estável entre idiomas.
doc.schema.FieldViolation.message=Explicação localizada, respeitando o `Accept-Language` da requisição.
doc.schema.FieldViolation.rejectedValue=O valor recusado, devolvido para depuração. Omitido quando \
  ausente ou quando carrega dado sensível.

doc.schema.ApiErrorCode.description=Identificador estável e legível por máquina da falha. Ramifique \
  sobre este valor em vez do status HTTP, que é propositalmente grosseiro — várias falhas sem \
  relação compartilham um mesmo status.
doc.schema.SupportedLanguage.description=Tag de idioma aceita pelo header `Accept-Language`, no \
  formato BCP 47.

doc.operation.payment.register.summary=Cadastrar um meio de pagamento
doc.operation.payment.register.description=Aceita qualquer uma das quatro variantes. O membro \
  `type` seleciona a variante e determina quais outros membros são obrigatórios — veja os exemplos \
  nomeados, cada um deles um payload que pode ser enviado sem modificação.\n\n\
  Segredos como número do cartão e código de segurança são write-only: obrigatórios aqui e \
  ausentes de toda resposta.
doc.request.payment.register=O meio de pagamento a cadastrar. Uma das quatro variantes, selecionada por `type`.
doc.response.payment.register.201=Cadastrado. O header `Location` traz a URL do novo recurso.

doc.operation.payment.get.summary=Consultar um meio de pagamento
doc.operation.payment.get.description=Retorna um meio de pagamento cadastrado. O objeto aninhado é \
  a mesma união discriminada usada no cadastro, menos os membros write-only.
doc.response.payment.get.200=O meio de pagamento solicitado.
doc.parameter.payment.instrumentId=Identificador atribuído pelo servidor ao meio de pagamento.

doc.operation.payment.list.summary=Listar meios de pagamento
doc.operation.payment.list.description=Retorna todos os meios de pagamento cadastrados, na ordem de cadastro.
doc.response.payment.list.200=Os meios de pagamento cadastrados, do mais antigo ao mais recente.

doc.example.payment.card=Cartão, a variante mais larga
doc.example.payment.pix=Chave Pix, a variante mais enxuta
doc.example.payment.boleto=Pagador de boleto
doc.example.payment.wallet=Conta de carteira digital

doc.schema.PaymentInstrumentType.description=Seleciona a variante do meio de pagamento. Este é o \
  discriminator: ele decide quais outros membros o payload deve carregar.
doc.schema.PaymentInstrument.description=Base da hierarquia de meios de pagamento. Nunca publicada \
  como schema — seus membros são achatados em cada variante, e por isso nenhum endpoint a referencia.
doc.schema.PaymentInstrument.type=Variante deste meio de pagamento, e o membro que o discriminator \
  lê. Retornado nas respostas além de aceito nas requisições, para o cliente conseguir fazer round-trip.
doc.schema.PaymentInstrument.label=Nome que o titular dá a este meio de pagamento, exibido ao \
  escolher entre vários.
doc.schema.PaymentInstrument.holderName=Nome do titular como consta no meio de pagamento.
doc.schema.PaymentInstrument.preferred=Se este meio deve ser oferecido primeiro. Nulo significa que \
  o titular não manifestou preferência, o que é diferente de tê-lo recusado.

doc.schema.CardInstrument.description=Um cartão de pagamento. A variante mais larga da união.
doc.schema.CardInstrument.number=Número do cartão, de 13 a 19 dígitos sem separadores. Write-only: \
  obrigatório no cadastro e ausente de toda resposta.
doc.schema.CardInstrument.expiryMonth=Mês de validade, 1 para janeiro até 12 para dezembro.
doc.schema.CardInstrument.expiryYear=Ano de validade, quatro dígitos.
doc.schema.CardInstrument.securityCode=Código de verificação do cartão, 3 ou 4 dígitos. Write-only, \
  e nunca armazenado.

doc.schema.PixInstrument.description=Uma chave Pix. A variante mais enxuta da união — dois membros \
  contra os seis do cartão.
doc.schema.PixInstrument.keyType=Tipo da chave Pix, que determina o formato que `key` deve ter.
doc.schema.PixInstrument.key=A chave em si. Seu formato depende de `keyType`: 11 dígitos para \
  `CPF`, 14 para `CNPJ`, um endereço de e-mail para `EMAIL`, um número E.164 para `PHONE`, um UUID \
  para `RANDOM`. É uma restrição dependente que o JSON Schema não expressa, portanto é validada no \
  serviço e declarada aqui em vez de insinuada por uma keyword.
doc.schema.PixKeyType.description=Tipo da chave Pix, que determina o formato esperado de `key`.

doc.schema.BoletoInstrument.description=Cadastro de pagador de boleto.
doc.schema.BoletoInstrument.taxId=Identificador fiscal do pagador: 11 dígitos para pessoa física, \
  14 para pessoa jurídica, sem separadores.
doc.schema.BoletoInstrument.postalCode=CEP do pagador, com ou sem separador.

doc.schema.WalletInstrument.description=Conta de carteira digital. Carrega um token emitido pelo \
  provedor em vez de qualquer detalhe do meio de pagamento subjacente.
doc.schema.WalletInstrument.provider=Provedor de carteira que mantém a conta.
doc.schema.WalletInstrument.accountReference=Identificador da conta junto ao provedor. Seguro de \
  devolver, ao contrário do token de dispositivo.
doc.schema.WalletInstrument.deviceToken=Token de dispositivo emitido pelo provedor. Write-only: \
  obrigatório no cadastro e ausente de toda resposta.
doc.schema.WalletProvider.description=Provedor de carteira que mantém a conta.

doc.schema.PaymentInstrumentResource.description=Um meio de pagamento cadastrado: os membros \
  atribuídos pelo servidor, mais a variante enviada pelo cliente aninhada dentro.
doc.schema.PaymentInstrumentResource.id=Identificador atribuído pelo servidor. Somente leitura.
doc.schema.PaymentInstrumentResource.registeredAt=Quando o meio de pagamento foi cadastrado. Somente leitura.
doc.schema.PaymentInstrumentResource.instrument=O meio de pagamento em si, como a mesma união \
  discriminada aceita no cadastro.

doc.tag.boletos.description=Emissão de boletos por um único endpoint que aceita três categorias. \
  Uma flag no corpo seleciona a categoria, e tanto o corpo aceito quanto o objeto retornado crescem \
  ou encolhem com ela.

doc.operation.boleto.issue.summary=Emitir um boleto
doc.operation.boleto.issue.description=Um endpoint, três categorias. O membro `category` no corpo \
  seleciona qual variante está sendo enviada, e a resposta é a variante correspondente — ou seja, o \
  formato do que você recebe é decidido pelo formato do que você enviou.\n\n\
  `SIMPLE` é o menor payload desta API: pagador, valor, vencimento. `HYBRID` acrescenta uma chave \
  Pix e devolve um objeto de QR code que a variante simples nem tem membro para carregar. `SPLIT` \
  acrescenta uma lista de recebedores e devolve um rateio calculado por recebedor.\n\n\
  Use o seletor de exemplos no request e no response para comparar as três lado a lado.
doc.request.boleto.issue=O boleto a emitir. Uma das três categorias, selecionada por `category`.
doc.response.boleto.issue.201=Emitido. A variante corresponde à categoria solicitada, e o header \
  `Location` traz a URL do novo boleto.

doc.operation.boleto.get.summary=Consultar um boleto
doc.operation.boleto.get.description=Retorna um boleto emitido como a variante com que foi emitido, \
  então o cliente precisa ramificar em `category` exatamente como faz na emissão.
doc.response.boleto.get.200=O boleto solicitado.
doc.parameter.boleto.boletoId=Identificador atribuído pelo servidor ao boleto.

doc.operation.boleto.list.summary=Listar boletos emitidos
doc.operation.boleto.list.description=Retorna todos os boletos emitidos na ordem de emissão. O array \
  mistura categorias, que é justamente o caso que o cliente mais erra.
doc.response.boleto.list.200=Os boletos emitidos, do mais antigo ao mais recente.

doc.example.boleto.request.simple=SIMPLE — o menor corpo
doc.example.boleto.request.simple.description=Quatro membros, nenhum dado opcional. É o piso do que o \
  endpoint aceita.
doc.example.boleto.request.hybrid=HYBRID — acrescenta pagamento instantâneo
doc.example.boleto.request.hybrid.description=Tudo o que o SIMPLE recebe, mais a chave Pix e a \
  validade do QR code que tornam o boleto pagável na hora.
doc.example.boleto.request.split=SPLIT — o maior corpo
doc.example.boleto.request.split.description=Acrescenta uma lista aninhada de recebedores cujos \
  percentuais o serviço converte em valores monetários.

doc.example.boleto.response.simple=SIMPLE — os menos membros
doc.example.boleto.response.simple.description=Código de barras, linha digitável, valor e datas. Nada \
  que um boleto simples não tenha.
doc.example.boleto.response.hybrid=HYBRID — acrescenta o objeto de QR code
doc.example.boleto.response.hybrid.description=Note o `qrCode`: um objeto aninhado sem equivalente na \
  resposta SIMPLE, e é por isso que ramificar em `category` é inevitável.
doc.example.boleto.response.split=SPLIT — acrescenta o rateio calculado
doc.example.boleto.response.split.description=Um rateio por recebedor, cada um carregando o valor \
  monetário que o serviço derivou do percentual solicitado.

doc.schema.Money.description=Um valor monetário com sua moeda. Nunca um número solto: valor sem moeda \
  é a ambiguidade mais cara que um contrato de pagamentos pode conter.
doc.schema.Money.amount=Valor decimal, no máximo duas casas fracionárias. Enviado como número JSON, \
  sem separador de milhar.
doc.schema.Money.currency=Código alfabético de moeda ISO 4217.

doc.schema.TaxIdentifier.description=Um identificador fiscal brasileiro, com o tipo derivado do tamanho.
doc.schema.TaxIdentifier.value=11 dígitos para pessoa física, 14 para pessoa jurídica, sem separadores.
doc.schema.TaxIdentifier.kind=Se o identificador pertence a pessoa física ou jurídica. Derivado pelo \
  serviço, portanto é somente leitura e não deve ser enviado.
doc.schema.TaxIdentifierKind.description=Se um identificador fiscal pertence a pessoa física ou jurídica.

doc.schema.Payer.description=Quem deve o boleto. Compartilhado pelas três categorias.
doc.schema.Payer.name=Nome completo ou razão social do pagador.
doc.schema.Payer.taxId=Identificador fiscal do pagador.
doc.schema.Payer.postalCode=CEP do endereço do pagador, com ou sem separador.

doc.schema.BoletoCategory.description=Seleciona a variante do boleto. É o discriminator do request e \
  do response: decide quais membros cada um carrega.
doc.schema.BoletoRequest.description=Base da requisição de emissão. Nunca publicada como schema — \
  seus membros são achatados em cada categoria, e por isso nenhum endpoint a referencia.
doc.schema.BoletoRequest.category=Categoria sendo emitida, e o membro que o discriminator lê.
doc.schema.BoletoRequest.payer=Quem deve o boleto.
doc.schema.BoletoRequest.amount=Valor de face do boleto.
doc.schema.BoletoRequest.dueDate=Data de vencimento. Precisa estar no futuro.
doc.schema.BoletoRequest.reference=Seu próprio identificador para este boleto, devolvido na \
  conciliação. Nulo quando você não tem um para informar.

doc.schema.SimpleBoletoRequest.description=Um boleto comum, pagável só por código de barras ou linha \
  digitável. O menor corpo de requisição desta API.
doc.schema.HybridBoletoRequest.description=Um boleto que também é pagável na hora via Pix.
doc.schema.HybridBoletoRequest.pixKey=Chave Pix que recebe o pagamento instantâneo deste boleto.
doc.schema.HybridBoletoRequest.qrCodeValidityMinutes=Por quantos minutos o QR code gerado continua \
  válido. O boleto segue pagável por código de barras depois que o código expira.
doc.schema.HybridBoletoRequest.allowPartialPayment=Se um pagamento abaixo do valor de face liquida o \
  boleto parcialmente. Nulo é tratado como não permitido.

doc.schema.SplitBoletoRequest.description=Um boleto cujo produto é dividido entre vários recebedores. \
  O maior corpo de requisição desta API.
doc.schema.SplitBoletoRequest.recipients=Quem recebe o produto, e em que proporção. Os percentuais \
  precisam somar 100.
doc.schema.SplitBoletoRequest.settlementMode=Quando a parte de cada recebedor é liquidada.
doc.schema.SplitBoletoRequest.statementDescriptor=Texto exibido no extrato dos recebedores.
doc.schema.SettlementMode.description=`ON_PAYMENT` liquida cada parte assim que o boleto é pago, \
  `ON_SCHEDULE` liquida conforme o cronograma de repasse do próprio recebedor.
doc.schema.SplitRecipient.description=Um recebedor do rateio, e a parte reivindicada para ele.
doc.schema.SplitRecipient.name=Razão social do recebedor.
doc.schema.SplitRecipient.taxId=Identificador fiscal do recebedor.
doc.schema.SplitRecipient.percentage=Parte do valor de face reivindicada para este recebedor, em \
  percentual. Todos os recebedores precisam somar 100.

doc.schema.BoletoResponse.description=Base do boleto emitido. Nunca publicada como schema — seus \
  membros são achatados em cada categoria.
doc.schema.BoletoResponse.category=Categoria deste boleto. Ramifique nela para saber quais outros \
  membros estão presentes.
doc.schema.BoletoResponse.status=Estado do ciclo de vida do boleto.
doc.schema.BoletoStatus.description=Estado do ciclo de vida: emitido aguardando pagamento, liquidado, \
  cancelado antes do pagamento, ou expirado sem pagamento.
doc.schema.BoletoResponse.id=Identificador atribuído pelo servidor ao boleto.
doc.schema.BoletoResponse.barcode=Dígitos do código de barras, legíveis por máquina, sem separadores.
doc.schema.BoletoResponse.digitableLine=Os mesmos dígitos agrupados para digitação humana, com os \
  separadores que o pagador vê impressos no boleto.
doc.schema.BoletoResponse.amount=Valor de face do boleto, como emitido.
doc.schema.BoletoResponse.dueDate=Data de vencimento do boleto.
doc.schema.BoletoResponse.issuedAt=Quando o boleto foi emitido.

doc.schema.SimpleBoletoResponse.description=Um boleto comum emitido. Não carrega nada além dos \
  membros que toda categoria tem, e é a linha de base contra a qual as outras duas devem ser lidas.
doc.schema.HybridBoletoResponse.description=Um boleto emitido que também é pagável via Pix.
doc.schema.HybridBoletoResponse.qrCode=O QR code gerado. Ausente de todas as outras categorias, e é \
  a razão pela qual o cliente não pode tratar as três respostas como um único tipo.
doc.schema.HybridBoletoResponse.partialPaymentAllowed=Se um pagamento abaixo do valor de face liquida \
  o boleto parcialmente, como resolvido na emissão.
doc.schema.QrCode.description=Um QR code Pix: o payload a codificar, uma imagem renderizada, e quando \
  ele deixa de ser válido.
doc.schema.QrCode.payload=Payload EMV QR Code. Codifique exatamente como está; não reformate.
doc.schema.QrCode.imageUri=URL do código renderizado, para clientes que não conseguem codificar o \
  payload por conta própria.
doc.schema.QrCode.expiresAt=Quando o código deixa de ser aceito. O boleto segue pagável por código de \
  barras.

doc.schema.SplitBoletoResponse.description=Um boleto emitido com o produto dividido entre recebedores.
doc.schema.SplitBoletoResponse.splits=Um rateio por recebedor solicitado, com o valor monetário que o \
  serviço calculou a partir do percentual.
doc.schema.SplitBoletoResponse.settlementMode=Quando cada parte é liquidada, como resolvido na emissão.
doc.schema.SplitAllocation.description=O que um recebedor recebe do rateio, com o valor calculado ao \
  lado do percentual solicitado.
doc.schema.SplitAllocation.name=Razão social do recebedor.
doc.schema.SplitAllocation.taxId=Identificador fiscal do recebedor.
doc.schema.SplitAllocation.percentage=Percentual solicitado para este recebedor.
doc.schema.SplitAllocation.amount=Parte monetária derivada do percentual, arredondada half-even para \
  a menor unidade da moeda.
