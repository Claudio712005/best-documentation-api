doc.info.summary=Reference implementation of a thoroughly documented, internationalized REST API.
doc.info.description=A working catalogue of OpenAPI 3.1 techniques, built to be read as much as \
  called. Every endpoint exists to demonstrate one documentation problem and its solution: \
  request bodies from two fields to deeply nested graphs, contracts assembled by composition \
  rather than copy-paste, polymorphic payloads where only the concrete variants appear in the \
  schema list, and responses that can be narrowed by the client.\n\n\
  The whole surface is negotiated through `Accept-Language` — not only error messages and \
  content, but this document itself. Request it with `Accept-Language: pt-BR` and every summary, \
  description and schema annotation comes back translated.

doc.tag.system.description=Liveness and contract metadata. The smallest possible request bodies \
  live here, as a baseline to compare the rest against.
doc.tag.catalog.description=Products and their localized content. Demonstrates how translated \
  data — as opposed to translated copy — belongs in a payload.
doc.tag.carts.description=Cart assembly through minimal, single-purpose requests. Each operation \
  takes two or three fields at most.
doc.tag.payment-instruments.description=Polymorphic payment instruments. Demonstrates a \
  discriminated union in which only the concrete variants are published as schemas.
doc.tag.orders.description=Order placement and retrieval. The largest request and response in \
  this API, and the place where composition pays for itself.

doc.header.accept-language.description=Preferred languages for this response, as an RFC 9110 \
  quality-weighted list. Applies to error messages, validation violations and localized content \
  alike. Unsupported languages fall back to `en-US` rather than failing.
doc.header.content-language.description=Language actually used for this response. May differ from \
  the request when no preferred language could be served.
doc.header.request-id.description=Caller-supplied correlation identifier, echoed on the response \
  and inside every error payload. Generated when absent.
doc.header.idempotency-key.description=Makes this unsafe operation replay-safe. Repeating a \
  request with the same key returns the original result; reusing a key with a different body is \
  rejected with `IDEMPOTENCY_CONFLICT`.

doc.response.400.description=The request could not be understood — unparseable body, or a \
  parameter of the wrong type.
doc.response.404.description=No resource exists at this address, or it is not visible to the caller.
doc.response.406.description=No language in `Accept-Language` can be served by this API.
doc.response.409.description=The request conflicts with the current state of the resource.
doc.response.422.description=The request was understood but violated a declared constraint. The \
  payload lists every violation, each located by JSON Pointer.
doc.response.500.description=Unexpected server-side failure. Carries only a trace identifier, \
  never internal detail.

doc.operation.system.health.summary=Check service liveness
doc.operation.system.health.description=Returns immediately and touches no dependency. Intended \
  for load-balancer probes, which is why it reports only whether this instance can serve traffic \
  and never aggregates the health of anything downstream.
doc.response.system.health.200=The instance is serving traffic.

doc.operation.system.languages.summary=List supported languages
doc.operation.system.languages.description=Enumerates the languages accepted in `Accept-Language`, \
  flagging which one is serving this very response and which is the fallback. Discoverable at \
  runtime so clients need not hard-code a copy of the list.
doc.response.system.languages.200=The supported languages, display names rendered in the language \
  negotiated for this request.

doc.schema.Health.description=Liveness of a single instance.
doc.schema.Health.status=Whether this instance can serve traffic.
doc.schema.Health.version=Version of the published contract this instance implements.
doc.schema.Health.checkedAt=Server time at which liveness was evaluated.
doc.schema.HealthStatus.description=`UP` when the instance serves traffic normally, `DEGRADED` \
  when it still answers but with reduced guarantees.

doc.schema.LanguageDescriptor.description=A language this API can serve.
doc.schema.LanguageDescriptor.tag=BCP 47 language tag, usable verbatim in `Accept-Language`.
doc.schema.LanguageDescriptor.displayName=Name of the language, rendered in the language negotiated \
  for this request rather than in the language being described.
doc.schema.LanguageDescriptor.negotiated=True for the language serving this response.
doc.schema.LanguageDescriptor.fallback=True for the language used when none of the requested ones \
  can be served.

doc.schema.Problem.description=Error payload following RFC 9457 (Problem Details for HTTP APIs). \
  Served with the `application/problem+json` media type by every failing operation in this API.
doc.schema.Problem.type=URI identifying the problem type. Dereferences to documentation describing \
  the failure and how to recover from it.
doc.schema.Problem.title=Short, human-readable summary of the problem type. Stable for a given \
  `type` and never interpolated with request data, so it is safe to use as a log key.
doc.schema.Problem.status=HTTP status code, repeated here so the payload is self-contained.
doc.schema.Problem.detail=Explanation specific to this occurrence. May interpolate request data, \
  so it must not be parsed by clients.
doc.schema.Problem.instance=URI reference identifying this specific occurrence — the request path.
doc.schema.Problem.code=RFC 9457 extension. Machine-readable error code; the value clients should \
  branch on.
doc.schema.Problem.traceId=RFC 9457 extension. Correlation identifier, echoed from the request's \
  `X-Request-Id` or generated. Quote it in support tickets.
doc.schema.Problem.timestamp=RFC 9457 extension. Server time at which the failure was observed.
doc.schema.Problem.violations=RFC 9457 extension. Present only for `VALIDATION_FAILED`, listing \
  every constraint that failed rather than just the first one.

doc.schema.FieldViolation.description=A single constraint violation, located by JSON Pointer within \
  the request.
doc.schema.FieldViolation.pointer=JSON Pointer (RFC 6901) to the offending node in the request \
  body, array indices included.
doc.schema.FieldViolation.constraint=Identifier of the violated constraint, stable across languages.
doc.schema.FieldViolation.message=Localized explanation, honouring the request's `Accept-Language`.
doc.schema.FieldViolation.rejectedValue=The value that was rejected, echoed back for debugging. \
  Omitted when absent or when it carries sensitive data.

doc.schema.ApiErrorCode.description=Stable, machine-readable identifier of the failure. Branch on \
  this value rather than on the HTTP status, which is intentionally coarse — several unrelated \
  failures share one status.
doc.schema.SupportedLanguage.description=Language tag accepted by the `Accept-Language` header, in \
  BCP 47 form.

doc.operation.payment.register.summary=Register a payment instrument
doc.operation.payment.register.description=Accepts any of the four instrument variants. The `type` \
  member selects the variant and determines which other members are required — see the named \
  examples, each of which is a payload that can be sent unmodified.\n\n\
  Secrets such as the card number and security code are write-only: they are required here and are \
  absent from every response.
doc.request.payment.register=The instrument to register. One of the four variants, selected by `type`.
doc.response.payment.register.201=Registered. `Location` carries the URL of the new instrument.

doc.operation.payment.get.summary=Retrieve a payment instrument
doc.operation.payment.get.description=Returns one registered instrument. The nested instrument is \
  the same discriminated union used on registration, minus the write-only members.
doc.response.payment.get.200=The requested instrument.
doc.parameter.payment.instrumentId=Server-assigned identifier of the instrument.

doc.operation.payment.list.summary=List payment instruments
doc.operation.payment.list.description=Returns every registered instrument in registration order.
doc.response.payment.list.200=The registered instruments, oldest first.

doc.example.payment.card=Card, the widest variant
doc.example.payment.pix=Pix key, the narrowest variant
doc.example.payment.boleto=Bank slip payer
doc.example.payment.wallet=Wallet provider account

doc.schema.PaymentInstrumentType.description=Selects the instrument variant. This is the \
  discriminator: it decides which other members the payload must carry.
doc.schema.PaymentInstrument.description=Base of the instrument hierarchy. Never published as a \
  schema — its members are flattened into each variant, which is why no endpoint references it.
doc.schema.PaymentInstrument.type=Variant of this instrument, and the member the discriminator \
  reads. Returned on responses as well as accepted on requests, so a client can round-trip it.
doc.schema.PaymentInstrument.label=Name the holder gives this instrument, shown when choosing \
  between several.
doc.schema.PaymentInstrument.holderName=Name of the holder as it appears on the instrument.
doc.schema.PaymentInstrument.preferred=Whether to offer this instrument first. Null means the \
  holder has expressed no preference, which is distinct from having declined it.

doc.schema.CardInstrument.description=A payment card. The widest variant of the union.
doc.schema.CardInstrument.number=Primary account number, 13 to 19 digits with no separators. \
  Write-only: required on registration and absent from every response.
doc.schema.CardInstrument.expiryMonth=Expiry month, 1 for January through 12 for December.
doc.schema.CardInstrument.expiryYear=Expiry year, four digits.
doc.schema.CardInstrument.securityCode=Card verification value, 3 or 4 digits. Write-only, and \
  never stored.

doc.schema.PixInstrument.description=A Pix key. The narrowest variant of the union — two members \
  against the card's six.
doc.schema.PixInstrument.keyType=Kind of Pix key, which determines the format `key` must take.
doc.schema.PixInstrument.key=The key itself. Its format depends on `keyType`: 11 digits for `CPF`, \
  14 for `CNPJ`, an e-mail address for `EMAIL`, an E.164 number for `PHONE`, a UUID for `RANDOM`. \
  This is a dependent constraint that JSON Schema cannot express, so it is validated by the service \
  and stated here rather than implied by a keyword.
doc.schema.PixKeyType.description=Kind of Pix key, which determines the expected format of `key`.

doc.schema.BoletoInstrument.description=A bank slip payer registration.
doc.schema.BoletoInstrument.taxId=Payer tax identifier: 11 digits for an individual, 14 for a \
  company, with no separators.
doc.schema.BoletoInstrument.postalCode=Payer postal code, with or without the separator.

doc.schema.WalletInstrument.description=A wallet provider account. Carries a provider-issued token \
  rather than any underlying instrument detail.
doc.schema.WalletInstrument.provider=Wallet provider holding the account.
doc.schema.WalletInstrument.accountReference=Identifier of the account at the provider. Safe to \
  echo back, unlike the device token.
doc.schema.WalletInstrument.deviceToken=Provider-issued device token. Write-only: required on \
  registration and absent from every response.
doc.schema.WalletProvider.description=Wallet provider holding the account.

doc.schema.PaymentInstrumentResource.description=A registered instrument: the server-assigned \
  members, plus the client-supplied variant nested inside.
doc.schema.PaymentInstrumentResource.id=Server-assigned identifier. Read-only.
doc.schema.PaymentInstrumentResource.registeredAt=When the instrument was registered. Read-only.
doc.schema.PaymentInstrumentResource.instrument=The instrument itself, as the same discriminated \
  union accepted on registration.
